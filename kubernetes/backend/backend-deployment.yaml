apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: hotel-backend
  labels:
    app: backend
    tier: backend
spec:
  replicas: 5
  selector:
    matchLabels:
      app: backend
      tier: backend
  template:
    metadata:
      labels:
        app: backend
        tier: backend
    spec:
      containers:
        - name: backend
          image: host.docker.internal:8082/backend:7de457b6bebf5ff0b716faf07f582bb385873702

          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http

          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret

          readinessProbe:
            httpGet:
              path: /hotels
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /hotels
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      
      imagePullSecrets:
        - name: regcred
