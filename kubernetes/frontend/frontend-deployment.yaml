apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: hotel-frontend
  labels:
    app: frontend
    tier: frontend
spec:
  replicas: 5
  selector:
    matchLabels:
      app: frontend
      tier: frontend
  template:
    metadata:
      labels:
        app: frontend
        tier: frontend
    spec:
      containers:
        - name: frontend
          image: host.docker.internal:8082/frontend:edd77642741615c75f7e9be95b154f979a331dc0

          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi

      imagePullSecrets:
        - name: regcred
