apiVersion: apps/v1
kind: Deployment
metadata:
  name: docker-registry
  namespace: artifact-registry
  labels:
    app: docker-registry
    tier: registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docker-registry
      tier: registry
  template:
    metadata:
      labels:
        app: docker-registry
        tier: registry
    spec:
      containers:
        - name: registry
          image: registry:2
          ports:
            - containerPort: 5000
              name: registry
          envFrom:
            - configMapRef:
                name: registry-config
          volumeMounts:
            - name: registry-data
              mountPath: /var/lib/registry
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: registry-data
          persistentVolumeClaim:
            claimName: registry-pvc
